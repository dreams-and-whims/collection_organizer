name: collection_organizer
description: A personal library tracker for books, manga, comics and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Local database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42

  # HTTP
  http: ^1.2.1

  # Image caching
  cached_network_image: ^3.3.1

  # Barcode / ISBN scanning
  mobile_scanner: ^7.2.0

  # Contacts
  flutter_contacts: ^2.0.2

  # Permissions
  permission_handler: ^12.0.1

  # Navigation
  go_router: ^17.2.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/placeholders/