name: collection_organizer
description: A personal library tracker for books, manga, comics and more.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.2.3
  http: ^1.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  mobile_scanner: ^7.2.0
  flutter_contacts: ^2.0.2
  permission_handler: ^12.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.33.0
  freezed: ^3.2.5
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/placeholders/